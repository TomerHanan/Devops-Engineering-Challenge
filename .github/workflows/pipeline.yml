name: DevOps Pipeline

on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This new step creates a lowercase version of the repo name and the branch tag
      - name: Prepare Image Metadata
        id: meta
        run: |
          # Convert Repo Name to lowercase
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> $GITHUB_OUTPUT
          
          # Create the dynamic tag (e.g., dev-a1b2c3d)
          BRANCH=${GITHUB_REF#refs/heads/}
          SHA=$(git rev-parse --short HEAD)
          echo "tag=${BRANCH}-${SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.branch }}-latest

      - name: Provision local cluster with vind
        run: |
          echo "Downloading vCluster CLI..."
            curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
            sudo install -c -m 0755 vcluster /usr/local/bin
            rm -f vcluster
          
            echo "Setting driver to Docker (vind mode)..."
            vcluster use driver docker
          
            echo "Creating the Kubernetes cluster..."
            vcluster create ci-cluster
          
            echo "Verifying cluster is running..."
            kubectl cluster-info
            kubectl get nodes

      - name: Prepare Helm Chart
        run: |
          # Do this BEFORE creating the cluster
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          # Use --skip-refresh since we just updated the repo
          helm dependency update ./devops-app-chart --skip-refresh

      - name: Provision local cluster with vind
        run: |
          curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
          sudo install -c -m 0755 vcluster /usr/local/bin
          vcluster use driver docker
          # MUST use --background and --connect=false for CI
          vcluster create ci-cluster --background --connect=false
          
          # Wait for the kubeconfig to be generated and cluster to be ready
          timeout 60s bash -c 'until kubectl get nodes; do sleep 5; done'

      - name: Deploy to vind
        run: |
          # No need to update dependencies here, we already did it!
          helm install my-devops-app ./devops-app-chart \
            --set image.repository=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }} \
            --set image.tag=${{ steps.meta.outputs.tag }} \
            --set mysql.primary.persistence.enabled=false \
            --wait --timeout 10m