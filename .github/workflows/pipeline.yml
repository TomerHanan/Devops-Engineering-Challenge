name: DevOps Pipeline

on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. PREPARE METADATA (Lowercase for GHCR)
      - name: Prepare Image Metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH=${GITHUB_REF#refs/heads/}
          SHA=$(git rev-parse --short HEAD)
          echo "repo=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "tag=${BRANCH}-${SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      # 2. LOGIN & BUILD (Pushes to GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.branch }}-latest

      # 3. PREPARE HELM
      - name: Prepare Helm Chart
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency update ./devops-app-chart --skip-refresh

      # 4. PROVISION CLUSTER (Fixed Connection Logic)
      - name: Provision local cluster with vind
        run: |
          curl -L -o vcluster "https://github.com/loft-sh/vcluster/releases/latest/download/vcluster-linux-amd64"
          sudo install -c -m 0755 vcluster /usr/local/bin
          
          vcluster use driver docker
          # Create without connecting immediately
          vcluster create ci-cluster --connect=false
          
          # CRITICAL: Manually update the kubeconfig so kubectl knows where to go
          # This fixes the "localhost:8080" error
          vcluster connect ci-cluster --update-current
          
          # Wait for API server to wake up
          sleep 20
          kubectl cluster-info
          kubectl get nodes

      # 5. AUTHENTICATE CLUSTER TO GHCR
      - name: Create Image Pull Secret
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}

      # 6. DEPLOY
      - name: Deploy to vind
        run: |
          helm install my-devops-app ./devops-app-chart \
            --set image.repository=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }} \
            --set image.tag=${{ steps.meta.outputs.tag }} \
            --set imagePullSecrets[0].name=ghcr-pull-secret \
            --set replicaCount=${{ github.ref_name == 'main' && 3 || 1 }} \
            --set mysql.primary.persistence.enabled=false \
            --wait --timeout 10m

      # 7. FINAL VERIFICATION
      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get svc