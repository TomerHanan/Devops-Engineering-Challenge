env:
            - name: SPRING_DATASOURCE_URL
              # Use the internal Kubernetes DNS name for the MySQL service
              value: "jdbc:mysql://{{ .Release.Name }}-mysql:3306/devops_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-app-chart.fullname" . }}-db-secret
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "devops-app-chart.fullname" . }}-db-secret
                  key: db-password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"